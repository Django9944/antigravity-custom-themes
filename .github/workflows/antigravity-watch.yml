name: Antigravity Host Watch

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 UTC+8)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_verify_asar:
        description: 'Download official Antigravity.zip and run real app.asar test even if version unchanged'
        required: false
        type: boolean
        default: false
      force_auto_release:
        description: 'Force bump version, commit, and publish a new GitHub Release even if host version unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  watch-antigravity:
    name: Monitor Official Antigravity Releases, Auto-Sync & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query official Antigravity update manifest
        id: probe
        run: |
          node scripts/check-antigravity-upstream.mjs --json > probe.json
          cat probe.json
          LATEST_VER="$(node -e "console.log(require('./probe.json').latestHostVersion)")"
          BUILD_ID="$(node -e "console.log(require('./probe.json').buildId)")"
          IS_NEW="$(node -e "console.log(require('./probe.json').isNewHostVersion ? 'true' : 'false')")"
          MAC_URL="$(node -e "console.log(require('./probe.json').platforms?.mac_arm64?.url || '')")"
          echo "latest_ver=${LATEST_VER}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "is_new=${IS_NEW}" >> "$GITHUB_OUTPUT"
          echo "mac_url=${MAC_URL}" >> "$GITHUB_OUTPUT"

      - name: Check existing tracking Issue state
        id: issue_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ steps.probe.outputs.build_id }}
        run: |
          TITLE="[Antigravity Watch] Official IDE Update & Compatibility Status"
          MARKER="antigravity-build:${BUILD_ID}"
          EXISTING_NUM="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          ALREADY_TRACKED="false"
          if [ -n "$EXISTING_NUM" ]; then
            EXISTING_BODY="$(gh issue view "$EXISTING_NUM" --json body --jq '.body')"
            if printf '%s' "$EXISTING_BODY" | grep -Fq "$MARKER"; then
              ALREADY_TRACKED="true"
            fi
          fi
          echo "issue_num=${EXISTING_NUM}" >> "$GITHUB_OUTPUT"
          echo "already_tracked=${ALREADY_TRACKED}" >> "$GITHUB_OUTPUT"

      - name: Download official Antigravity.zip, verify/auto-adapt ASAR, and auto-release on new host version
        id: sync_release
        if: steps.probe.outputs.is_new == 'true' || steps.issue_state.outputs.already_tracked == 'false' || github.event.inputs.force_verify_asar == 'true' || github.event.inputs.force_auto_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VER: ${{ steps.probe.outputs.latest_ver }}
          BUILD_ID: ${{ steps.probe.outputs.build_id }}
          MAC_URL: ${{ steps.probe.outputs.mac_url }}
          IS_NEW: ${{ steps.probe.outputs.is_new }}
          FORCE_RELEASE: ${{ github.event.inputs.force_auto_release }}
        run: |
          TMP_MAC="$(mktemp -d)"
          curl -sSL --max-time 180 -o "${TMP_MAC}/Antigravity.zip" "$MAC_URL"
          unzip -q "${TMP_MAC}/Antigravity.zip" "*/Contents/Resources/app.asar" -d "$TMP_MAC"
          REAL_ASAR="${TMP_MAC}/Antigravity.app/Contents/Resources/app.asar"

          if [ "$IS_NEW" = "true" ] || [ "$FORCE_RELEASE" = "true" ]; then
            set +e
            node scripts/auto-sync-host-release.mjs --asar "$REAL_ASAR" --host-version "$LATEST_VER" --build-id "$BUILD_ID" > sync-result.json
            SYNC_EXIT=$?
            set -e
            cat sync-result.json

            if [ "$SYNC_EXIT" -eq 0 ]; then
              NEW_TAG="$(node -e "console.log(require('./sync-result.json').newThemeVersion)")"
              AUTO_ADAPTED="$(node -e "console.log(require('./sync-result.json').autoAdapted ? 'true' : 'false')")"
              node tests/test-asar-patcher.mjs

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add manifest.json current.js CHANGELOG.md
              git commit -m "chore(release): auto-sync compatibility for Antigravity ${LATEST_VER} (${NEW_TAG})"
              git tag -fa "$NEW_TAG" -m "Release ${NEW_TAG}: auto-synced for Antigravity ${LATEST_VER}"
              git push origin main
              git push -f origin "$NEW_TAG"

              bash scripts/package-release.sh "$NEW_TAG"
              gh release create "$NEW_TAG" \
                "dist/antigravity-custom-themes-${NEW_TAG}-macos.zip" \
                "dist/antigravity-custom-themes-${NEW_TAG}-windows.zip" \
                "dist/antigravity-custom-themes-${NEW_TAG}-universal.zip" \
                "dist/SHA256SUMS.txt" \
                --title "${NEW_TAG} — 自动同步适配 Antigravity ${LATEST_VER}" \
                --notes-file dist/RELEASE_NOTES.md \
                --latest

              echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
              echo "auto_adapted=${AUTO_ADAPTED}" >> "$GITHUB_OUTPUT"
            fi
          fi

          set +e
          node scripts/check-antigravity-upstream.mjs --json --verify-local-asar "$REAL_ASAR" > verified.json
          VERIFY_EXIT=$?
          set -e
          rm -rf "$TMP_MAC"
          cat verified.json
          echo "verify_exit=${VERIFY_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Create or update compatibility tracking Issue
        if: steps.probe.outputs.is_new == 'true' || steps.issue_state.outputs.already_tracked == 'false' || github.event.inputs.force_verify_asar == 'true' || github.event.inputs.force_auto_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue_state.outputs.issue_num }}
          ALREADY_TRACKED: ${{ steps.issue_state.outputs.already_tracked }}
          NEW_TAG: ${{ steps.sync_release.outputs.new_tag }}
          AUTO_ADAPTED: ${{ steps.sync_release.outputs.auto_adapted }}
        run: |
          TITLE="[Antigravity Watch] Official IDE Update & Compatibility Status"
          BODY="$(node -e "
            const d = require('./verified.json');
            const v = d.asarVerification || {};
            const doc = v.doctor || {};
            const ok = Boolean(v.compatible);
            const newTag = process.env.NEW_TAG || '';
            const autoAdapted = process.env.AUTO_ADAPTED === 'true';
            const badge = ok
              ? (autoAdapted ? '✅ AUTO-ADAPTED & RELEASED (自动探测新锚点并发版通过)' : '✅ COMPATIBLE (真实 app.asar 注入 & 字节级剥离校验通过)')
              : '❌ INCOMPATIBLE (注入锚点或结构大幅变更，需人工适配 manifest.json)';
            const relLine = newTag
              ? '| **自动发布主题版本** | [' + newTag + '](https://github.com/Django9944/antigravity-custom-themes/releases/tag/' + newTag + ') |'
              : '';
            const hints = Array.isArray(v.candidateHints) && v.candidateHints.length
              ? '\n### 候选锚点代码片段 (`dist/utils.js`)\n\`\`\`js\n' + v.candidateHints.join('\n') + '\n\`\`\`\n'
              : '';
            console.log([
              '<!-- antigravity-build:' + d.buildId + ' -->',
              '云端巡检已从 Google Antigravity 官方自动更新通道拉取最新版本并完成真实 \`app.asar\` 注入回归测试：',
              '',
              '| 项目 | 状态 |',
              '| :--- | :--- |',
              '| **官方最新版本** | \`' + d.latestHostVersion + '\` (build: \`' + d.buildId + '\`) |',
              '| **仓库已登记版本** | \`' + d.verifiedHostVersion + '\` (主题版本: \`' + d.themeVersion + '\`) |',
              relLine,
              '| **真实 ASAR 兼容性** | ' + badge + ' |',
              '| **命中注入锚点** | \`' + (doc.matchedAnchor || '<NONE>') + '\` |',
              '| **ASAR SHA256 (前16位)** | \`' + (doc.asarSha256 || 'N/A') + '...\` (' + (doc.asarSize || 0) + ' bytes) |',
              '| **macOS arm64 官方包** | ' + (d.platforms?.mac_arm64?.url || 'N/A') + ' |',
              '| **macOS x64 官方包** | ' + (d.platforms?.mac_x64?.url || 'N/A') + ' |',
              '| **Windows x64 官方包** | ' + (d.platforms?.win_x64?.url || 'N/A') + ' |',
              hints
            ].filter(Boolean).join('\n'));
          ")"

          COMPAT="$(node -e "console.log(require('./verified.json').asarVerification?.compatible ? 'true' : 'false')")"
          VER="$(node -e "console.log(require('./verified.json').latestHostVersion)")"
          BUILD="$(node -e "console.log(require('./verified.json').buildId)")"

          if [ -n "$ISSUE_NUM" ]; then
            gh issue edit "$ISSUE_NUM" --body "$BODY"
            if [ -n "$NEW_TAG" ]; then
              gh issue comment "$ISSUE_NUM" --body "🚀 检测到 Antigravity 官方新版本 \`${VER}\` (\`${BUILD}\`)，云端已自动完成兼容性验证、更新仓库并发布新版本 [**${NEW_TAG}**](https://github.com/Django9944/antigravity-custom-themes/releases/tag/${NEW_TAG})！"
            elif [ "$ALREADY_TRACKED" != "true" ]; then
              gh issue comment "$ISSUE_NUM" --body "🔔 检测到 Antigravity 官方新构建 \`${VER}\` (\`${BUILD}\`)，云端真实 \`app.asar\` 校验结果：**compatible=${COMPAT}**"
            fi
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

          if [ "$COMPAT" != "true" ]; then
            echo "::error::Official Antigravity ${VER} (${BUILD}) failed app.asar compatibility verification!"
            exit 1
          fi
